<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bfWing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2ce" />
      <stop offset="35%" stop-color="#e8be6c" />
      <stop offset="70%" stop-color="#b68331" />
      <stop offset="100%" stop-color="#694314" />
    </linearGradient>
    <linearGradient id="bfWing2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae7b9" />
      <stop offset="45%" stop-color="#d9a54a" />
      <stop offset="85%" stop-color="#936220" />
      <stop offset="100%" stop-color="#4e2c0e" />
    </linearGradient>
    <filter id="bfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#4d331d" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#bfShadow)" transform="rotate(-15 150 150)">
    <!-- Body -->
    <path d="M150 100 C147 130 146 180 150 210 C154 180 153 130 150 100 Z" fill="#442a12" />
    <circle cx="150" cy="94" r="7" fill="#442a12" />
    <!-- Antennae -->
    <path d="M148 90 Q135 65 110 55" fill="none" stroke="#5a3819" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="110" cy="55" r="3.5" fill="#caa14d" />
    <path d="M152 90 Q165 65 190 55" fill="none" stroke="#5a3819" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="190" cy="55" r="3.5" fill="#caa14d" />
    <!-- Left Forewing -->
    <path d="M147 115 C120 70 50 50 30 90 C12 125 55 175 145 160 Z" fill="url(#bfWing1)" opacity="0.95" />
    <path d="M147 115 C120 70 50 50 30 90 C12 125 55 175 145 160 Z" fill="none" stroke="#5a3819" stroke-width="2" />
    <!-- Left Wing Veins -->
    <path d="M140 130 Q80 100 45 95 M135 140 Q75 125 50 140 M125 148 Q85 160 65 165" fill="none" stroke="#875922" stroke-width="1.2" opacity="0.75" />
    <!-- Right Forewing -->
    <path d="M153 115 C180 70 250 50 270 90 C288 125 245 175 155 160 Z" fill="url(#bfWing2)" opacity="0.95" />
    <path d="M153 115 C180 70 250 50 270 90 C288 125 245 175 155 160 Z" fill="none" stroke="#5a3819" stroke-width="2" />
    <path d="M160 130 Q220 100 255 95 M165 140 Q225 125 250 140 M175 148 Q215 160 235 165" fill="none" stroke="#875922" stroke-width="1.2" opacity="0.75" />
    <!-- Left Hindwing -->
    <path d="M146 160 C100 170 65 210 95 245 C125 270 146 220 148 185 Z" fill="url(#bfWing1)" opacity="0.9" />
    <path d="M146 160 C100 170 65 210 95 245 C125 270 146 220 148 185 Z" fill="none" stroke="#5a3819" stroke-width="1.8" />
    <!-- Right Hindwing -->
    <path d="M154 160 C200 170 235 210 205 245 C175 270 154 220 152 185 Z" fill="url(#bfWing2)" opacity="0.9" />
    <path d="M154 160 C200 170 235 210 205 245 C175 270 154 220 152 185 Z" fill="none" stroke="#5a3819" stroke-width="1.8" />
    <!-- Shimmer Sparkles on wings -->
    <circle cx="55" cy="85" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="75" cy="70" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="245" cy="85" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="225" cy="70" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
