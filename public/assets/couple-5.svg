<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="pGrad_couple-" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8f2e7" />
      <stop offset="100%" stop-color="#e4d2b3" />
    </radialGradient>
    <linearGradient id="gold_couple-" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caa052" />
      <stop offset="50%" stop-color="#f3dda0" />
      <stop offset="100%" stop-color="#895c20" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#pGrad_couple-)" />
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="url(#gold_couple-)" stroke-width="1.5" />
  <rect x="30" y="30" width="540" height="540" fill="none" stroke="#a6782b" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5" />

  <!-- Corner Flourishes -->
  <path d="M20 50 Q50 50 50 20" fill="none" stroke="url(#gold_couple-)" stroke-width="2" />
  <path d="M580 50 Q550 50 550 20" fill="none" stroke="url(#gold_couple-)" stroke-width="2" />
  <path d="M20 550 Q50 550 50 580" fill="none" stroke="url(#gold_couple-)" stroke-width="2" />
  <path d="M580 550 Q550 550 550 580" fill="none" stroke="url(#gold_couple-)" stroke-width="2" />

  <!-- Central Silhouette / Emblem -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="130" fill="#fffef9" stroke="url(#gold_couple-)" stroke-width="2" />
    <circle cx="0" cy="0" r="118" fill="none" stroke="#d8c199" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Romantic Motif Icon -->
    <text x="0" y="-30" font-size="42" fill="#7d592a" text-anchor="middle">♧</text>
    <text x="0" y="15" font-family="'Great Vibes', cursive" font-size="44" fill="#3d2813" text-anchor="middle">Best day ever</text>
    <text x="0" y="50" font-family="'Noto Serif Khmer', serif" font-size="14" font-weight="bold" fill="#7d592a" text-anchor="middle" letter-spacing="2">រ &amp; រ</text>
  </g>

  <!-- Bottom Captions -->
  <g transform="translate(300, 465)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" fill="#4d331d" text-anchor="middle" letter-spacing="2">Everlasting Joy</text>
    <text x="0" y="26" font-family="'Kantumruy Pro', sans-serif" font-size="13" fill="#84755f" text-anchor="middle" letter-spacing="1">Evening candlelit banquet</text>
    <text x="0" y="50" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-style="italic" fill="#ac7b24" text-anchor="middle">25 · 01 · 2027</text>
  </g>
