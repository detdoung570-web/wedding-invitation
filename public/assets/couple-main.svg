<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1050" width="820" height="1050">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fffbf0" />
      <stop offset="40%" stop-color="#f5ebd6" />
      <stop offset="80%" stop-color="#ebd9b9" />
      <stop offset="100%" stop-color="#d8c199" />
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76501f" />
      <stop offset="25%" stop-color="#c99a4d" />
      <stop offset="50%" stop-color="#fde9b5" />
      <stop offset="75%" stop-color="#be8d3d" />
      <stop offset="100%" stop-color="#5f3e15" />
    </linearGradient>
    <linearGradient id="royalGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6121" />
      <stop offset="50%" stop-color="#e4bb69" />
      <stop offset="100%" stop-color="#a4742a" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3d2813" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="820" height="1050" fill="url(#bgGrad)" />

  <!-- Outer Traditional Khmer Decorative Border -->
  <rect x="30" y="30" width="760" height="990" fill="none" stroke="url(#goldFoil)" stroke-width="3" />
  <rect x="44" y="44" width="732" height="962" fill="none" stroke="#a6782b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Corner Kbach Ornaments -->
  <g fill="url(#goldFoil)">
    <!-- Top-Left -->
    <path d="M30 30 L65 30 C55 42 42 55 30 65 Z" />
    <circle cx="75" cy="75" r="5" />
    <path d="M48 48 Q65 60 75 75 Q60 65 48 48" fill="none" stroke="url(#goldFoil)" stroke-width="2" />
    <!-- Top-Right -->
    <path d="M790 30 L755 30 C765 42 778 55 790 65 Z" />
    <circle cx="745" cy="75" r="5" />
    <!-- Bottom-Left -->
    <path d="M30 1020 L65 1020 C55 1008 42 995 30 985 Z" />
    <circle cx="75" cy="975" r="5" />
    <!-- Bottom-Right -->
    <path d="M790 1020 L755 1020 C765 1008 778 995 790 985 Z" />
    <circle cx="745" cy="975" r="5" />
  </g>

  <!-- Arch Garland Frame -->
  <path d="M110 500 C110 240 240 120 410 120 C580 120 710 240 710 500 L710 880 C710 900 690 920 670 920 L150 920 C130 920 110 900 110 880 Z" fill="#fffef9" opacity="0.85" stroke="url(#goldFoil)" stroke-width="2" filter="url(#softShadow)" />

  <!-- Arch Dome Decorative Pattern -->
  <path d="M140 490 C140 270 260 160 410 160 C560 160 680 270 680 490" fill="none" stroke="#caa35e" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.7" />

  <!-- Monogram Crest -->
  <g transform="translate(410, 205)">
    <circle cx="0" cy="0" r="34" fill="#fcf6e8" stroke="url(#goldFoil)" stroke-width="2" />
    <text x="0" y="8" font-family="'Noto Serif Khmer', 'Moul', serif" font-size="22" font-weight="bold" fill="#76501f" text-anchor="middle">រ &amp; រ</text>
    <path d="M-55 0 Q-40 -15 -25 0 M25 0 Q40 -15 55 0" fill="none" stroke="url(#goldFoil)" stroke-width="2" />
  </g>

  <!-- Elegant Traditional Cambodian Couple Silhouettes / Artistic Wedding Art -->
  <g transform="translate(410, 520)">
    <!-- Halo / Golden Aura -->
    <circle cx="0" cy="-50" r="160" fill="#f9eac8" opacity="0.55" />

    <!-- Groom (Left) -->
    <g transform="translate(-85, 0)">
      <!-- Shoulders & Sampot Traditional Attire -->
      <path d="M0 -75 C-25 -75 -45 -65 -60 -40 C-75 -15 -85 40 -90 180 L35 180 C30 110 30 0 10 -45 C-2 -65 -15 -75 0 -75 Z" fill="#4a341f" opacity="0.9" />
      <!-- Golden Collar & Sash (Phamuong / Kben) -->
      <path d="M-10 -40 L-45 180 L-15 180 L15 -20 Z" fill="url(#royalGold)" opacity="0.85" />
      <path d="M-35 -40 Q0 -30 20 -38" fill="none" stroke="url(#goldFoil)" stroke-width="4" />
      <!-- Groom Head & Hair -->
      <circle cx="-2" cy="-115" r="32" fill="#392514" />
      <path d="M-18 -135 C10 -150 25 -130 25 -110 C15 -110 -10 -115 -18 -135 Z" fill="#221408" />
    </g>

    <!-- Bride (Right) -->
    <g transform="translate(85, 10)">
      <!-- Sabai / Traditional Silk Sash & Pleated Gown -->
      <path d="M0 -70 C-15 -70 -25 -40 -35 0 C-40 40 -45 120 -50 170 L75 170 C70 90 60 -10 40 -50 C25 -68 12 -70 0 -70 Z" fill="#5c3d24" opacity="0.9" />
      <!-- Golden Pleated Sabai Shawl Across Shoulder -->
      <path d="M-20 -40 C-5 -30 15 10 30 170 L55 170 C40 40 20 -20 0 -45 Z" fill="url(#goldFoil)" />
      <path d="M-25 -35 Q5 -20 30 -30" fill="none" stroke="url(#goldFoil)" stroke-width="4" />
      <!-- Bride Head, Updo & Traditional Wedding Crown (Mkot) -->
      <circle cx="-2" cy="-105" r="28" fill="#392514" />
      <!-- Khmer Bridal Crown Diadem / Tiara -->
      <path d="M-16 -128 L-2 -165 L12 -128 L20 -124 L-24 -124 Z" fill="url(#royalGold)" stroke="#694514" stroke-width="1" />
      <circle cx="-2" cy="-168" r="4" fill="#ffffff" stroke="url(#goldFoil)" stroke-width="1.5" />
      <!-- Jasmine Hair Garland -->
      <path d="M-18 -112 Q-22 -85 -10 -75" fill="none" stroke="#fff8e7" stroke-width="5" stroke-dasharray="3,3" />
    </g>

    <!-- Hands Holding / Jasmine Garland Blessing -->
    <g transform="translate(0, 110)">
      <path d="M-40 10 Q0 35 40 10" fill="none" stroke="#fffdf7" stroke-width="6" stroke-dasharray="4,3" />
      <path d="M-15 18 L0 42 L15 18 Z" fill="url(#goldFoil)" />
      <circle cx="0" cy="22" r="6" fill="#a84a53" />
    </g>
  </g>

  <!-- Traditional Lotus Pedestal at Bottom -->
  <g transform="translate(410, 770)">
    <path d="M-180 30 C-100 0 100 0 180 30 C120 75 -120 75 -180 30 Z" fill="url(#goldFoil)" opacity="0.2" />
    <path d="M-120 20 C-60 5 60 5 120 20" fill="none" stroke="url(#goldFoil)" stroke-width="2" />
    <!-- Floating Petals -->
    <path d="M-150 10 Q-130 -15 -110 5 Q-130 25 -150 10 Z" fill="#c95b68" opacity="0.8" />
    <path d="M110 5 Q130 -15 150 10 Q130 25 110 5 Z" fill="#c95b68" opacity="0.8" />
  </g>

  <!-- Typography Plate -->
  <g transform="translate(410, 835)">
    <text x="0" y="0" font-family="'Noto Serif Khmer', 'Moul', serif" font-size="24" font-weight="bold" fill="#76501f" text-anchor="middle" letter-spacing="2">សំរិទ្ធ រតនា ❦ រាជ្យ ពៅរដ្ឋា</text>
    <text x="0" y="28" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-style="italic" fill="#ac7b24" text-anchor="middle" letter-spacing="4">EST. 25 JANUARY 2027</text>
    <text x="0" y="50" font-family="'Kantumruy Pro', sans-serif" font-size="12" font-weight="500" fill="#8a785d" text-anchor="middle" letter-spacing="3">PHNOM PENH · CAMBODIA</text>
  </g>
</svg>